services:
  # ── PostgreSQL Database for Temporal ────────────────────────────────────
  postgres:
    image: postgres:14-alpine
    container_name: temporal-postgres
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
      - POSTGRES_DB=temporal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 3s
      timeout: 3s
      retries: 10

  # ── Temporal Server (auto-setup with PostgreSQL) ─────────────────────────
  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: temporal
    ports:
      - "7233:7233"   # gRPC frontend
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ── Temporal Web UI ─────────────────────────────────────────────────────
  temporal-ui:
    image: temporalio/ui:2.31.2
    container_name: temporal-ui
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    depends_on:
      temporal:
        condition: service_started

  # ── Redis ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Express API Server ─────────────────────────────────────────────────
  api:
    build: .
    container_name: hotel-api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_TASK_QUEUE=hotel-search
      - REDIS_URL=redis://redis:6379
      - BASE_URL=http://hotel-api:3000
      - LOG_LEVEL=info
    depends_on:
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  # ── Temporal Worker ────────────────────────────────────────────────────
  worker:
    build: .
    container_name: hotel-worker
    command: ["node", "dist/temporal/worker.js"]
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_TASK_QUEUE=hotel-search
      - REDIS_URL=redis://redis:6379
      - BASE_URL=http://hotel-api:3000
      - LOG_LEVEL=info
    depends_on:
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
